name: Release Android TV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.4.7; defaults to v<pubspec version>)'
        required: false
        type: string
        default: ''
      force_update:
        description: 'Mark release as forced update in latest.json'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish GitHub Release as prerelease'
        required: false
        type: boolean
        default: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang lld
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --fatal-warnings
        shell: bash

      - name: Run Flutter tests
        run: flutter test
        shell: bash

  release-android-tv:
    name: Release Android TV
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang lld
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      - name: Determine release metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pubspec_ver=$(awk -F: '/^version:[[:space:]]*/ {val=$2; sub(/#.*/, "", val); gsub(/["'\''[:space:]]/, "", val); print val; exit}' pubspec.yaml)
          if [ -z "$pubspec_ver" ]; then
            echo "::error::Failed to parse version from pubspec.yaml"
            exit 1
          fi
          pubspec_name="${pubspec_ver%%+*}"
          if [ "$pubspec_ver" = "$pubspec_name" ]; then
            pubspec_code=""
          else
            pubspec_code="${pubspec_ver#*+}"
          fi

          tag=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag=$(printf '%s' "$INPUT_TAG" | xargs)
          elif [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            tag="v${pubspec_name}"
          fi

          version="${tag#v}"
          version="${version#V}"
          if [ -z "$version" ]; then
            echo "::error::Resolved release version is empty for tag '$tag'"
            exit 1
          fi

          {
            echo "TAG=$tag"
            echo "VERSION=$version"
            echo "VERSION_CODE=${pubspec_code:-1}"
          } >> "$GITHUB_ENV"
          echo "Resolved TAG=$tag VERSION=$version VERSION_CODE=${pubspec_code:-1}"
        shell: bash

      - name: Configure Android release signing
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TV_KEYSTORE_BASE64" ]; then
            echo "::warning::TV_KEYSTORE_BASE64 not configured; falling back to debug signing."
            exit 0
          fi
          if [ -z "$TV_KEYSTORE_PASSWORD" ] || [ -z "$TV_KEY_ALIAS" ] || [ -z "$TV_KEY_PASSWORD" ]; then
            echo "::error::TV_KEYSTORE_BASE64 is set, but TV_KEYSTORE_PASSWORD, TV_KEY_ALIAS, or TV_KEY_PASSWORD is missing."
            exit 1
          fi
          printf '%s' "$TV_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/kazumi-tv-release.jks
          if [ ! -s android/app/kazumi-tv-release.jks ]; then
            echo "::error::Decoded android/app/kazumi-tv-release.jks is empty."
            exit 1
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            'kazumi-tv-release.jks' \
            "$TV_KEYSTORE_PASSWORD" \
            "$TV_KEY_ALIAS" \
            "$TV_KEY_PASSWORD" > android/key.properties
          chmod 600 android/app/kazumi-tv-release.jks android/key.properties
        shell: bash

      - name: Build split APKs
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
          KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
          KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --build-name="${VERSION}" \
            --build-number="${VERSION_CODE}" \
            --dart-define=TV_UPDATE_REPO="${GITHUB_REPOSITORY}" \
            --dart-define=DANDANAPI_APPID="${DANDANAPI_APPID}" \
            --dart-define=DANDANAPI_KEY="${DANDANAPI_KEY}" \
            --dart-define=KAZUMI_APPID="${KAZUMI_APPID}" \
            --dart-define=KAZUMI_KEY="${KAZUMI_KEY}"
        shell: bash

      - name: Stage release APKs and generate update manifest
        env:
          FORCE_UPDATE: ${{ inputs.force_update == true }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist/KazumiTV_${VERSION}_arm64-v8a.apk"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "dist/KazumiTV_${VERSION}_armeabi-v7a.apk"
          cp "build/app/outputs/flutter-apk/app-x86_64-release.apk" "dist/KazumiTV_${VERSION}_x86_64.apk"

          dart tool/generate_update_manifest.dart \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --version "${VERSION}" \
            --version-code "${VERSION_CODE}" \
            --apk-dir dist \
            --force "${FORCE_UPDATE}" \
            --out-manifest dist/latest.json \
            --out-checksums dist/SHA256SUMS.txt
        shell: bash

      - name: Clean up signing files
        if: always()
        run: rm -f android/app/kazumi-tv-release.jks android/key.properties
        shell: bash

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-tv-release-${{ env.TAG }}
          path: |
            dist/KazumiTV_*.apk
            dist/latest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            dist/KazumiTV_*.apk
            dist/latest.json
            dist/SHA256SUMS.txt
